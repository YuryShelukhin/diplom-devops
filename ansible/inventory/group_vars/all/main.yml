---
# Версия Kubernetes
k8s_version: "1.30"
k8s_package_version: "1.30.0-1.1"
k8s_apt_key_url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key"
k8s_apt_repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"

# containerd
containerd_version: "1.7.22"
containerd_config_dir: "/etc/containerd"
containerd_cri_socket: "unix:///run/containerd/containerd.sock"

# Сети
pod_cidr: "10.244.0.0/16"
service_cidr: "10.96.0.0/12"
k8s_vip: "10.0.1.100"
k8s_api_port: 6443

# DNS-имя control plane endpoint.
# На мастерах резолвится в собственный IP (ВМ из target group YC NLB
# не может обращаться к себе через порт таргета), на воркерах - в k8s_vip.
k8s_api_dns: "k8s-api.internal"

# Calico CNI
calico_version: "v3.28.2"
calico_ipv4pool_cidr: "10.244.0.0/16"

# Kernel модули
kernel_modules:
  - overlay
  - br_netfilter

# Sysctl параметры
sysctl_params:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
  net.ipv6.conf.all.forwarding: 1
  
swap_disabled: true
